[package]
name = "pyblock-miner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pyblockMiner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2b_simd = "1"
hex = "0.4"
ratatui = "0.29"
crossterm = "0.28"
ureq = "2"   # tiny blocking HTTP(S) client for the pool network-stats endpoint (rustls, bundled roots)

[profile.release]
opt-level = 3
lto = true
